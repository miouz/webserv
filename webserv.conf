server
{
    listen 8080;
    error_page 404 errors/404.html;
    error_page 405 errors/405.html;
    client_max_body_size 40000;
    location /var/www/html
    {
        root .;
        autoindex on;
        methods GET POST DELETE;
        return 1 errors/return;
        upload_store upload;
        index index1;
        cgi_extension .php cgi/php;
        cgi_extension .py cgi/py;
    }
}
