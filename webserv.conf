server
{
    listen 8083;
    error_page 301 errors/301.html;
    error_page 403 errors/403.html;
    error_page 404 errors/404.html;
    error_page 405 errors/405.html;
    error_page 405 errors/500.html;
    client_max_body_size 40000;


	location /
    {
		root /home/skc/Documents/42/github/webserv;
        autoindex on;
        methods GET POST DELETE;
        return 1 errors/return;
        upload_store upload;
        index index1;
        cgi_extension .php cgi/php;
        cgi_extension .py cgi/py;
    }
}
