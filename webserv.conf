server
{
    listen 8094;
    client_max_body_size 40000;


	location /test
    {
		root /var/www/html;
        autoindex on;
        methods GET POST DELETE;
        return 1 errors/return;
        upload_store upload;
        index index1;
        cgi_extension .php cgi/php;
        cgi_extension .py cgi/py;
    }
}
